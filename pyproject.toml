[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "compas_shapeop"
description = "ShapeOp wrapper for COMPAS."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "LICENSE.shapeop", "THIRD_PARTY_NOTICES.md"]
authors = [
    { name = "Petras Vestartas", email = "petrasvestartas@gmail.com" },
    { name = "Tom Van Mele", email = "tom.v.mele@gmail.com" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = ["compas>=3,<4", "numpy>=1.26"]
dynamic = ["version"]

[dependency-groups]
build = [
    "build>=1.2",
    "cibuildwheel>=2.23",
    "cmake>=3.26",
    "nanobind>=2.12",
    "ninja>=1.11",
    "scikit-build-core>=0.10",
    "twine>=6",
]
test = ["pytest>=8", "pytest-cov>=5"]
quality = ["pyright==1.1.414", "ruff>=0.14"]
examples = ["compas-viewer>=2"]
dev = [
    { include-group = "build" },
    { include-group = "test" },
    { include-group = "quality" },
    { include-group = "examples" },
    "bump-my-version>=1.2",
    "invoke>=2.2",
]
docs = [
    { include-group = "dev" },
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.30",
]

[project.urls]
Homepage = "https://github.com/compas-dev/compas_shapeop"
Documentation = "https://compas-dev.github.io/compas_shapeop"
Repository = "https://github.com/compas-dev/compas_shapeop"
Changelog = "https://github.com/compas-dev/compas_shapeop/blob/main/CHANGELOG.md"
Issues = "https://github.com/compas-dev/compas_shapeop/issues"
Forum = "https://forum.compas-framework.org/"

[tool.uv.sources]
compas = { git = "https://github.com/compas-dev/compas.git", rev = "3c1a2e8e0e5c4c14292ecf4bb38c82e5b977273e" }
compas-viewer = { git = "https://github.com/compas-dev/compas_viewer.git", rev = "cf5a5195bda840a511319d6b7201978af68c15e3" }

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--tb=short", "--import-mode=importlib"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
wheel.py-api = "cp312"
cmake.version = ">=3.26"
cmake.build-type = "Release"
sdist.include = [
    ".github/scripts/**",
    "docs/**",
    "examples/**",
    "tests/**",
    "src/shapeop/**",
    "src/compas.h",
    "src/shapeop.cpp",
    "mkdocs.yml",
    "REFERENCES.md",
]
sdist.exclude = [".venv/**", "build/**", "dist/**", "site/**"]

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "src/compas_shapeop/__init__.py"

[tool.cibuildwheel]
build = ["cp312-*"]
build-verbosity = 3
build-frontend = "build[uv]"
manylinux-x86_64-image = "manylinux_2_28"
skip = ["*_i686", "*-musllinux_*", "*-win32", "pp*"]
test-requires = ["compas>=3,<4", "numpy>=1.26", "pytest>=8"]
test-command = "pytest {project}/tests"
macos.environment.MACOSX_DEPLOYMENT_TARGET = "11.0"
macos.archs = ["x86_64", "arm64"]

[tool.bumpversion]
current_version = "0.1.2"
message = "Bump version to {new_version}"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "src/compas_shapeop/__init__.py"
search = "{current_version}"
replace = "{new_version}"

[[tool.bumpversion.files]]
filename = "CHANGELOG.md"
search = "Unreleased"
replace = "[{new_version}] {now:%Y-%m-%d}"

[tool.ruff]
line-length = 179
indent-width = 4
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
known-first-party = ["compas", "compas_shapeop"]
force-single-line = true
order-by-type = true

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]
"tests/*" = ["I001"]
"tasks.py" = ["I001"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = "dynamic"
exclude = ["docs/**/*.md"]

[tool.pyright]
include = ["src/compas_shapeop", "tests", "examples", "docs/examples"]
exclude = ["build", "dist", "external"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingModuleSource = false
